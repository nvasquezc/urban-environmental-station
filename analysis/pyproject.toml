[project]
name = "uestation"
version = "0.2.0"
description = "Cadena de analisis para la estacion ambiental urbana"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Néstor Oswaldo Vásquez Castro" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "plotly>=5.24",
    "kaleido>=0.2.1",
    "requests>=2.32",
    "pyarrow>=17.0",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "jupyterlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uestation"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
