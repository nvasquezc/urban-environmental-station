[platformio]
default_envs = esp8266_d1mini
src_dir = src
include_dir = include
lib_dir = lib

[env]
framework = arduino
monitor_speed = 115200
build_flags =
    -D FW_VERSION=\"0.2.0\"
    -Wall
lib_deps =
    mikalhart/TinyGPSPlus @ ^1.1.0
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/Adafruit AHTX0 @ ^2.0.5
    bblanchon/ArduinoJson @ ^7.2.0

; ---- Prototipo actual: ESP8266 + DFR0034 (analogico, NO trazable) ----
[env:esp8266_d1mini]
platform = espressif8266 @ ^4.2.1
board = d1_mini
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld
monitor_filters = time, esp8266_exception_decoder
build_flags =
    ${env.build_flags}
    -D UES_SOUND_ANALOG=1
lib_deps =
    ${env.lib_deps}
    plerup/EspSoftwareSerial @ ^6.17.1

; ---- Puente: ESP32-S3 con el DFR0034, para migrar por etapas ----
[env:esp32s3_analog]
platform = espressif32 @ ^6.9.0
board = esp32-s3-devkitc-1
board_build.filesystem = littlefs
monitor_filters = time, esp32_exception_decoder
build_flags =
    ${env.build_flags}
    -D UES_SOUND_ANALOG=1

; ---- Destino v0.3: ESP32-S3 + ICS-43434 (I2S, ponderacion A) ----
[env:esp32s3_i2s]
platform = espressif32 @ ^6.9.0
board = esp32-s3-devkitc-1
board_build.filesystem = littlefs
monitor_filters = time, esp32_exception_decoder
build_flags =
    ${env.build_flags}
    -D UES_SOUND_I2S=1
